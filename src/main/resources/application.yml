# ============================================================
# Spring Boot 4.1 + Spring AI 2.0.0 后端配置
# 阶段：习惯养成聊天机器人 (Habit Agent)
#
# 双数据源策略：
#   1) 本地 MongoDB (localhost:27017) —— 聊天记忆 / 会话 / 分析任务等结构化数据
#   2) 远端 MongoDB Atlas         —— 仅承载 RAG 向量库（依赖 Atlas $vectorSearch）
# ============================================================

spring:
  profiles:
    active: local
  application:
    name: habit-agent
  # 允许自定义 mongoTemplate(@Primary) 覆盖自动配置生成的同名 bean
  main:
    allow-bean-definition-overriding: true

  # ===== 双数据源 =====
  # 主库 = 本地 MongoDB（spring.mongodb.uri）：聊天记忆 / 会话 / 分析任务等结构化数据（localhost:27017）。
  # 远端 Atlas = app.atlas.mongodb.uri：仅承载 RAG 向量库（habit_knowledge），由 AtlasVectorStoreConfig 单独连接。
  # 注意：Spring Boot 4.1 已将 Mongo 连接属性前缀由 spring.data.mongodb 改为 spring.mongodb。
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/habit_agent}
  data:
    mongodb:
      auto-index-creation: true

  # ===== AI 通用配置（Spring AI 2.0.0）=====
  ai:
    # Chat 记忆存储（MongoDB）
    model:
      chat: qwen3.5-plus
      embedding: text-embedding-v4

    chat:
      memory:
        mongodb:
          collection-name: ai_chat_memory
    # 向量存储（MongoDB）—— 仅配置项，实际连接由 AtlasVectorStoreConfig 接管
    vectorstore:
      mongodb:
        collection-name: habit_knowledge
        index-name: habit_vector_index
        path-name: embedding
        metadata-fields-to-filter: doc_type,source
        initialize-schema: false

    openai:
      # DashScope 兼容 OpenAI 协议
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:sk-your-key}
      chat:
        enabled: true
        options:
          model: qwen3.5-plus
          temperature: 0.7
      embedding:
        enabled: true
        options:
          model: text-embedding-v4

    # ===== 子模块 1：健康日历 =====
  # 注意：此处仅为骨架，后续接入真实数据源
  # datasource:
  #   url: jdbc:mysql://localhost:3306/habit_calendar
  #   username: root
  #   password: 123456
  #   driver-class-name: com.mysql.cj.jdbc.Driver

# ===== 双数据源连接串 =====
# 主库 = 本地 MongoDB（聊天记忆 / 会话 / 分析任务）：默认 localhost:27017，可用 MONGODB_URI 环境变量覆盖。
# 远端 Atlas（仅承载 RAG 向量库）：可用 ATLAS_MONGODB_URI 环境变量覆盖。
app:
  atlas:
    mongodb:
      uri: ${ATLAS_MONGODB_URI:mongodb+srv://2030795235_db_user:VPo5H4Fzq746cEX7@yu-xingyou.zaoakeu.mongodb.net/habit_agent}

logging:
  level:
    root: INFO
    com.habit.agent: DEBUG
    org.springframework.ai: INFO
    org.springframework.data.mongodb: WARN
    com.mongodb: WARN

# ===== 本地开发环境（激活时见 application-local.yml 覆盖）=====
---
spring:
  config:
    activate:
      on-profile: local
  # 本地开发使用 DashScope Key（来自 application-local.yml）
