server:
  port: 8080

spring:
  application:
    name: habit-agent

  # ===== MySQL 数据源（子模块 1-2）=====
  datasource:
    url: jdbc:mysql://localhost:3306/habit_agent?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root        # TODO: 请替换为你的 MySQL 用户名
    password: 0927        # TODO: 请替换为你的 MySQL 密码（或设置环境变量 MYSQL_PASSWORD）
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA / Hibernate（子模块 1-2）=====
  jpa:
    hibernate:
      ddl-auto: update          # 自动建表/更新表结构
    show-sql: true              # 控制台打印 SQL
    properties:
      hibernate:
        format_sql: true        # 格式化 SQL 输出
        dialect: org.hibernate.dialect.MySQLDialect

