<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 公共 Head 片段 -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' - 生活习惯助手'">生活习惯助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand { font-weight: 700; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .chat-message { margin-bottom: 1rem; }
        .chat-user { background: #e3f2fd; padding: 0.75rem 1rem; border-radius: 12px 12px 4px 12px; display: inline-block; max-width: 80%; }
        .chat-ai { background: #f1f8e9; padding: 0.75rem 1rem; border-radius: 12px 12px 12px 4px; display: inline-block; max-width: 80%; }
        .typing-indicator span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #aaa; margin: 0 2px; animation: bounce 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    </style>
</head>

<body>

<!-- 公共导航栏片段 -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-heart-pulse-fill"></i> 生活习惯助手
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'index'} ? 'active'" href="/">
                        <i class="bi bi-house-door"></i> 首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'checkin'} ? 'active'" href="/checkin">
                        <i class="bi bi-check2-circle"></i> 每日打卡
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'history'} ? 'active'" href="/history">
                        <i class="bi bi-clock-history"></i> 历史记录
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'trend'} ? 'active'" href="/trend">
                        <i class="bi bi-graph-up"></i> 趋势分析
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'ai-chat'} ? 'active'" href="/ai-chat">
                        <i class="bi bi-robot"></i> AI 建议
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 公共脚本片段 -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
