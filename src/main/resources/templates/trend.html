<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('趋势分析')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('trend')}"></nav>

<div class="container py-4">
    <h4 class="fw-bold mb-3"><i class="bi bi-graph-up" style="color:var(--teal-700);"></i> 趋势分析</h4>

    <!-- 统计概览：平均睡眠/运动/饮水（渐变背景+粒子流动） -->
    <div class="row g-3 mb-4">
        <!-- 平均睡眠 -->
        <div class="col-md-4">
            <div class="stat-gradient stat-gradient-sleep p-3 text-center position-relative overflow-hidden rounded-4">
                <canvas class="particle-canvas position-absolute top-0 start-0 w-100 h-100"
                        data-c1="rgba(129,140,248,0.6)" data-c2="rgba(99,102,241,0.9)"
                        data-bg1="#e0e7ff" data-bg2="#c7d2fe"
                        style="pointer-events:none; opacity:0.9; z-index:0;"></canvas>
                <div style="position:relative; z-index:1;">
                    <div class="text-muted small mb-1">平均睡眠时长</div>
                    <div class="fw-bold fs-4 text-indigo mb-1" style="color:#312e81;"
                         th:text="${avgSleep} != null ? ${avgSleep} + 'h' : '—'">—</div>
                    <div class="small" style="color:#4338ca;"
                         th:text="'目标 ' + ${targetSleep} + 'h · 达成率 ' + ${sleepRate} + '%'">目标 8.0h · 达成率 92%</div>
                    <div class="progress mt-2" style="height:5px; background:rgba(49,46,129,0.15);">
                        <div class="progress-bar" th:style="'width:' + ${sleepRate} + '%; background:linear-gradient(90deg,#6366f1,#a5b4fc);'"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 平均运动 -->
        <div class="col-md-4">
            <div class="stat-gradient stat-gradient-exercise p-3 text-center position-relative overflow-hidden rounded-4">
                <canvas class="particle-canvas position-absolute top-0 start-0 w-100 h-100"
                        data-c1="rgba(251,191,36,0.6)" data-c2="rgba(245,158,11,0.9)"
                        data-bg1="#fef3c7" data-bg2="#fed7aa"
                        style="pointer-events:none; opacity:0.9; z-index:0;"></canvas>
                <div style="position:relative; z-index:1;">
                    <div class="text-muted small mb-1">平均运动时长</div>
                    <div class="fw-bold fs-4 mb-1" style="color:#92400e;"
                         th:text="${avgExercise} != null ? ${avgExercise} + 'min' : '—'">—</div>
                    <div class="small" style="color:#9a3412;"
                         th:text="'目标 ' + ${targetExercise} + 'min · 达成率 ' + ${exerciseRate} + '%'">目标 30min · 达成率 133%</div>
                    <div class="progress mt-2" style="height:5px; background:rgba(146,64,14,0.15);">
                        <div class="progress-bar" th:style="'width:' + ${exerciseRate} + '%; background:linear-gradient(90deg,#f59e0b,#fcd34d);'"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 平均饮水 -->
        <div class="col-md-4">
            <div class="stat-gradient stat-gradient-water p-3 text-center position-relative overflow-hidden rounded-4">
                <canvas class="particle-canvas position-absolute top-0 start-0 w-100 h-100"
                        data-c1="rgba(34,211,238,0.6)" data-c2="rgba(6,182,212,0.9)"
                        data-bg1="#cffafe" data-bg2="#a5f3fc"
                        style="pointer-events:none; opacity:0.9; z-index:0;"></canvas>
                <div style="position:relative; z-index:1;">
                    <div class="text-muted small mb-1">平均饮水量</div>
                    <div class="fw-bold fs-4 mb-1" style="color:#155e75;"
                         th:text="${avgWater} != null ? ${avgWater} + 'ml' : '—'">—</div>
                    <div class="small" style="color:#0e7490;"
                         th:text="'目标 ' + ${targetWater} + 'ml · 达成率 ' + ${waterRate} + '%'">目标 2000ml · 达成率 80%</div>
                    <div class="progress mt-2" style="height:5px; background:rgba(21,94,117,0.15);">
                        <div class="progress-bar" th:style="'width:' + ${waterRate} + '%; background:linear-gradient(90deg,#06b6d4,#67e8f9);'"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4 个 ECharts 图表容器 -->
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card p-3">
                <h6 class="mb-2"><i class="bi bi-moon-stars text-indigo"></i> 睡眠时长趋势</h6>
                <div id="sleepChart" style="height: 280px;"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card p-3">
                <h6 class="mb-2"><i class="bi bi-bicycle text-warning"></i> 运动时长趋势</h6>
                <div id="exerciseChart" style="height: 280px;"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card p-3">
                <h6 class="mb-2"><i class="bi bi-droplet text-info"></i> 饮水量趋势</h6>
                <div id="waterChart" style="height: 280px;"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card p-3">
                <h6 class="mb-2"><i class="bi bi-grid-3x3-gap" style="color:var(--teal-700);"></i> 习惯综合雷达图</h6>
                <div id="radarChart" style="height: 280px;"></div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script th:inline="javascript">
// ========== 数据准备（后端注入） ==========
const records = /*[[${records}]]*/ [];
const targetSleep = /*[[${targetSleep}]]*/ 8.0;
const targetExercise = /*[[${targetExercise}]]*/ 30;
const targetWater = /*[[${targetWater}]]*/ 2000;
const targetDiet = /*[[${targetDiet}]]*/ 4;
const sleepRate = /*[[${sleepRate}]]*/ 0;
const exerciseRate = /*[[${exerciseRate}]]*/ 0;
const waterRate = /*[[${waterRate}]]*/ 0;
const dietRate = /*[[${dietRate}]]*/ 0;
const moodRate = /*[[${moodRate}]]*/ 0;

// 按日期升序（records 是 DESC 从新到旧，反转一下）
const sorted = [...records].sort((a, b) => (a.recordDate || '').localeCompare(b.recordDate || ''));
const labels = sorted.map(r => r.recordDate ? r.recordDate.substring(5) : '');
const sleepData = sorted.map(r => r.sleepDuration ? +r.sleepDuration : null);
const exerciseData = sorted.map(r => r.exerciseDuration || null);
const waterData = sorted.map(r => r.waterIntake || null);

// ========== 睡眠趋势（折线图 + 渐变填充 + 目标线） ==========
const sleepChart = echarts.init(document.getElementById('sleepChart'));
sleepChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => v != null ? v + ' h' : '未记录' },
    grid: { left: 40, right: 20, top: 30, bottom: 40 },
    xAxis: { type: 'category', data: labels, axisLabel: { color: '#64748b', fontSize: 11 } },
    yAxis: { type: 'value', name: 'h', min: 0, max: 12, axisLabel: { color: '#64748b' } },
    series: [
        {
            name: '睡眠时长',
            type: 'line',
            smooth: true,
            symbolSize: 6,
            data: sleepData,
            connectNulls: true,
            itemStyle: { color: '#6366f1' },
            lineStyle: { width: 3, color: '#4f46e5' },
            areaStyle: {
                color: {
                    type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [
                        { offset: 0, color: 'rgba(99,102,241,0.45)' },
                        { offset: 1, color: 'rgba(99,102,241,0.02)' }
                    ]
                }
            },
            markLine: {
                symbol: 'none',
                lineStyle: { type: 'dashed', color: '#ef4444' },
                data: [{ yAxis: targetSleep, name: '目标 ' + targetSleep + 'h', label: { color: '#ef4444', formatter: '目标 {c}h' } }]
            }
        }
    ]
});

// ========== 运动趋势（柱状图 + 渐变色） ==========
const exerciseChart = echarts.init(document.getElementById('exerciseChart'));
exerciseChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => v != null ? v + ' min' : '未记录' },
    grid: { left: 40, right: 20, top: 30, bottom: 40 },
    xAxis: { type: 'category', data: labels, axisLabel: { color: '#64748b', fontSize: 11 } },
    yAxis: { type: 'value', name: 'min', axisLabel: { color: '#64748b' } },
    series: [
        {
            name: '运动时长',
            type: 'bar',
            data: exerciseData,
            barWidth: 16,
            itemStyle: {
                borderRadius: [6, 6, 0, 0],
                color: {
                    type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [
                        { offset: 0, color: '#f59e0b' },
                        { offset: 1, color: '#fbbf24' }
                    ]
                }
            },
            markLine: {
                symbol: 'none',
                lineStyle: { type: 'dashed', color: '#ef4444' },
                data: [{ yAxis: targetExercise, label: { color: '#ef4444', formatter: '目标 {c}min' } }]
            }
        }
    ]
});

// ========== 饮水趋势（柱状图 + 水滴渐变色） ==========
const waterChart = echarts.init(document.getElementById('waterChart'));
waterChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => v != null ? v + ' ml' : '未记录' },
    grid: { left: 50, right: 20, top: 30, bottom: 40 },
    xAxis: { type: 'category', data: labels, axisLabel: { color: '#64748b', fontSize: 11 } },
    yAxis: { type: 'value', name: 'ml', axisLabel: { color: '#64748b' } },
    series: [
        {
            name: '饮水量',
            type: 'bar',
            data: waterData,
            barWidth: 16,
            itemStyle: {
                borderRadius: [6, 6, 0, 0],
                color: {
                    type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [
                        { offset: 0, color: '#06b6d4' },
                        { offset: 1, color: '#67e8f9' }
                    ]
                }
            },
            markLine: {
                symbol: 'none',
                lineStyle: { type: 'dashed', color: '#ef4444' },
                data: [{ yAxis: targetWater, label: { color: '#ef4444', formatter: '目标 {c}ml' } }]
            }
        }
    ]
});

// ========== 习惯综合雷达图（5维度达成率） ==========
const radarChart = echarts.init(document.getElementById('radarChart'));
radarChart.setOption({
    tooltip: { valueFormatter: v => v + '%' },
    radar: {
        indicator: [
            { name: '睡眠', max: 100 },
            { name: '运动', max: 100 },
            { name: '饮水', max: 100 },
            { name: '饮食', max: 100 },
            { name: '心情', max: 100 }
        ],
        radius: '65%',
        splitArea: { areaStyle: { color: ['rgba(15,118,110,0.03)', 'rgba(15,118,110,0.06)'] } },
        axisName: { color: '#475569', fontSize: 13, fontWeight: 500 }
    },
    series: [{
        type: 'radar',
        data: [{
            name: '30天平均达成率',
            value: [sleepRate, exerciseRate, waterRate, dietRate, moodRate],
            symbol: 'circle',
            symbolSize: 6,
            lineStyle: { color: '#0f766e', width: 2 },
            itemStyle: { color: '#0f766e' },
            areaStyle: {
                color: {
                    type: 'radial', x: 0.5, y: 0.5, r: 0.5,
                    colorStops: [
                        { offset: 0, color: 'rgba(13,148,136,0.55)' },
                        { offset: 1, color: 'rgba(20,184,166,0.15)' }
                    ]
                }
            },
            label: { show: true, formatter: '{c}%', color: '#115e59', fontSize: 11, fontWeight: 600 }
        }]
    }]
});

// 响应式 resize
const allCharts = [sleepChart, exerciseChart, waterChart, radarChart];
window.addEventListener('resize', () => allCharts.forEach(c => c.resize()));

// ========== 粒子流动效果（三个卡片 canvas） ==========
/**
 * 每个卡片 canvas：
 *  - 绘制 80 个随机漂浮的粒子
 *  - 粒子颜色：在 data-c1 / data-c2 两色之间随时间做循环渐变
 *  - 粒子间的连线：距离 < 阈值时淡色连接（可选）
 *  - 整体风格：粒子缓慢漂浮，大小变化，透明度脉动
 */
(function initParticles() {
    const canvases = document.querySelectorAll('canvas.particle-canvas');
    canvases.forEach(canvas => {
        // 使用 ResizeObserver 把 canvas 内部尺寸同步到显示尺寸
        const resize = () => {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        if (window.ResizeObserver) {
            new ResizeObserver(resize).observe(canvas);
        } else {
            window.addEventListener('resize', resize);
        }

        const c1 = canvas.dataset.c1 || 'rgba(99,102,241,0.5)';
        const c2 = canvas.dataset.c2 || 'rgba(6,182,212,0.9)';
        const ctx = canvas.getContext('2d');
        const W = () => canvas.clientWidth;
        const H = () => canvas.clientHeight;

        const N = 70;
        const particles = [];
        for (let i = 0; i < N; i++) {
            particles.push({
                x: Math.random() * W(),
                y: Math.random() * H(),
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                r: Math.random() * 2.5 + 0.8,
                phase: Math.random() * Math.PI * 2
            });
        }

        // 颜色插值（rgba 字符串 → rgba 数值数组）
        const parseRGBA = (s) => {
            const m = s.match(/rgba?\(([^)]+)\)/);
            if (!m) return [0, 0, 0, 1];
            const parts = m[1].split(',').map(s => parseFloat(s.trim()));
            return [parts[0] || 0, parts[1] || 0, parts[2] || 0, parts[3] != null ? parts[3] : 1];
        };
        const mix = (a, b, t) => [
            a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t,
            a[3] + (b[3] - a[3]) * t
        ];
        const rgbaStr = (arr) => `rgba(${arr[0].toFixed(0)},${arr[1].toFixed(0)},${arr[2].toFixed(0)},${arr[3].toFixed(3)})`;
        const a1 = parseRGBA(c1), a2 = parseRGBA(c2);

        let t0 = performance.now();
        const render = (now) => {
            const t = (now - t0) / 1000;
            ctx.clearRect(0, 0, W(), H());
            // 粒子颜色渐变相位（0..1 循环）
            const mixT = 0.5 + 0.5 * Math.sin(t * 0.6);
            const baseColor = mix(a1, a2, mixT);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                // 脉动透明度（每粒子 phase 不同，效果更有层次）
                const pulse = 0.55 + 0.35 * Math.sin(t * 1.2 + p.phase);
                const size = p.r * (0.8 + 0.35 * Math.sin(t * 1.6 + p.phase));
                // 颜色：在基色基础上加入每粒子的微小差异
                const pc = [
                    Math.min(255, baseColor[0] + Math.sin(p.phase) * 20),
                    Math.min(255, baseColor[1] + Math.sin(p.phase + 1) * 20),
                    Math.min(255, baseColor[2] + Math.sin(p.phase + 2) * 20),
                    baseColor[3] * pulse
                ];
                // 外发光：通过两次画圆做 halo
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 2.6, 0, Math.PI * 2);
                ctx.fillStyle = rgbaStr([pc[0], pc[1], pc[2], pc[3] * 0.12]);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fillStyle = rgbaStr(pc);
                ctx.fill();

                // 移动
                p.x += p.vx;
                p.y += p.vy;
                // 边界回弹
                if (p.x < -10) p.x = W() + 10;
                if (p.x > W() + 10) p.x = -10;
                if (p.y < -10) p.y = H() + 10;
                if (p.y > H() + 10) p.y = -10;
            }

            // 粒子间的淡色连接（只连距离近的，提升质感）
            const linkDist = 70;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const pi = particles[i], pj = particles[j];
                    const dx = pi.x - pj.x, dy = pi.y - pj.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < linkDist * linkDist) {
                        const alpha = (1 - Math.sqrt(d2) / linkDist) * 0.22 * baseColor[3];
                        ctx.strokeStyle = `rgba(${baseColor[0].toFixed(0)},${baseColor[1].toFixed(0)},${baseColor[2].toFixed(0)},${alpha.toFixed(3)})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(pi.x, pi.y);
                        ctx.lineTo(pj.x, pj.y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(render);
        };
        requestAnimationFrame(render);
    });
})();
</script>
</body>
</html>
